name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1        # sets up cl.exe for VS 2022 x64
    - name: Build & test
      run: .\build.cmd                    # your script handles everything

  macos-clang:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      run: bash ./build.sh
        
  linux-gcc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      run: bash ./build.sh

  # The sanitizers don't see reads of uninitialized memory, which change results only when the stray bytes happen to
  # matter. Valgrind reports every one.
  linux-valgrind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - name: Replay the fuzz corpus under Valgrind
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq valgrind
        bash tools/replayFuzzCorpus.sh valgrind

  # PIKA_64_BIT_INTEGERS on both platforms where int64_t differs: long long on Windows, long on Linux.
  windows-msvc-int64:
    runs-on: windows-latest
    env:
      CPP_OPTIONS: /D PIKA_64_BIT_INTEGERS=1
    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Build & test
      run: .\build.cmd

  linux-gcc-int64:
    runs-on: ubuntu-latest
    env:
      CPP_OPTIONS: -DPIKA_64_BIT_INTEGERS=1
    steps:
    - uses: actions/checkout@v4
    - name: Build & test
      run: bash ./build.sh
